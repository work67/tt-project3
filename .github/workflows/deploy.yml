name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reseed:
        description: 'Reseed database: DELETE all live data and recreate the 10 accounts with the current SEED_PASSWORD'
        type: boolean
        default: false

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The account id isn't sensitive, so it may be an Actions secret or variable.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build client
        run: npm run build -w client

      # Skip (don't fail) until Cloudflare is set up, so pushes stay green.
      - name: Check Cloudflare setup
        id: setup
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN secret,"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID secret,"
          grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' server/wrangler.jsonc \
            && missing="$missing real database_id in server/wrangler.jsonc,"
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy skipped::Missing:${missing%,}. See README > Deploying with GitHub Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.setup.outputs.ready == 'true'
        working-directory: server
        run: npx wrangler d1 migrations apply DB --remote

      # Manual runs only. Wipes before deploying, so the new version (with the new
      # SEED_PASSWORD) is what seeds the empty database on its first request.
      - name: Wipe D1 for reseed
        if: steps.setup.outputs.ready == 'true' && inputs.reseed
        working-directory: server
        run: >-
          npx wrangler d1 execute DB --remote --command
          "DELETE FROM sessions; DELETE FROM settlements; DELETE FROM expense_shares;
          DELETE FROM expenses; DELETE FROM todos; DELETE FROM users; DELETE FROM login_attempts;"

      # SEED_PASSWORD (optional GitHub secret) is uploaded with this version, so a fresh
      # database is never seeded before the password exists. Omitted = keep the existing one.
      - name: Deploy Worker (API + client)
        if: steps.setup.outputs.ready == 'true'
        working-directory: server
        run: |
          if [ -n "$SEED_PASSWORD" ]; then
            secrets="$RUNNER_TEMP/worker-secrets.json"
            node -e 'console.log(JSON.stringify({ SEED_PASSWORD: process.env.SEED_PASSWORD }))' > "$secrets"
            npx wrangler deploy --secrets-file "$secrets"
            rm -f "$secrets"
          else
            npx wrangler deploy
          fi
