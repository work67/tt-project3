name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; a newer push waits for the current one.
concurrency:
  group: deploy-cloudflare
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
      WRANGLER_SEND_METRICS: 'false'

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build client
        run: npm run build -w client

      # Skip (don't fail) until Cloudflare is set up, so pushes stay green.
      - name: Check Cloudflare setup
        id: setup
        run: |
          missing=""
          [ -n "$CLOUDFLARE_API_TOKEN" ] || missing="$missing CLOUDFLARE_API_TOKEN secret,"
          [ -n "$CLOUDFLARE_ACCOUNT_ID" ] || missing="$missing CLOUDFLARE_ACCOUNT_ID secret,"
          grep -q '"database_id": "00000000-0000-0000-0000-000000000000"' server/wrangler.jsonc \
            && missing="$missing real database_id in server/wrangler.jsonc,"
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy skipped::Missing:${missing%,}. See README > Deploying with GitHub Actions."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply D1 migrations
        if: steps.setup.outputs.ready == 'true'
        working-directory: server
        run: npx wrangler d1 migrations apply DB --remote

      # SEED_PASSWORD (optional GitHub secret) is uploaded with this version, so a fresh
      # database is never seeded before the password exists. Omitted = keep the existing one.
      - name: Deploy Worker (API + client)
        if: steps.setup.outputs.ready == 'true'
        working-directory: server
        run: |
          if [ -n "$SEED_PASSWORD" ]; then
            secrets="$RUNNER_TEMP/worker-secrets.json"
            node -e 'console.log(JSON.stringify({ SEED_PASSWORD: process.env.SEED_PASSWORD }))' > "$secrets"
            npx wrangler deploy --secrets-file "$secrets"
            rm -f "$secrets"
          else
            npx wrangler deploy
          fi
